<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
<title>Four things that cost nothing and save lives</title>
<desc>A public-health pictogram poster: wash hands with soap for 20 seconds; oral rehydration solution of 1 litre clean water, 6 level teaspoons sugar and half a teaspoon salt; hands-only CPR at 100 to 120 pushes a minute; press hard on heavy bleeding and keep pressing.</desc>
<rect width="1000" height="1400" fill="#F3EEE3"/>
<text x="40" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1C1B1A" text-anchor="start" >Four things that cost nothing</text>
<text x="40" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1C1B1A" text-anchor="start" >and save lives.</text>
<rect x="40" y="205" width="920" height="4" fill="#1C1B1A"/>
<g transform="translate(40,250)">
<rect x="0" y="0" width="445" height="470" rx="10" ry="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="2"/>
<circle cx="42" cy="42" r="26" fill="#1C1B1A" />
<text x="42" y="53" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FBF9F4" text-anchor="middle" >1</text>
<g transform="translate(0,70)">
<path d="M 168 -46 V 6 Q 168 24 186 24 H 234 V 44" fill="none" stroke="#1C1B1A" stroke-width="20" stroke-linejoin="round"/><rect x="216" y="40" width="36" height="14" rx="4" ry="4" fill="#1C1B1A" /><path d="M 224 52 h 20 v 60 q 0 10 -10 10 q -10 0 -10 -10 Z" fill="#2E6FB5"/><g transform="translate(178,186) rotate(-22)"><g transform="scale(1,1)"><rect x="-45" y="-40" width="90" height="105" rx="34" ry="34" fill="#1C1B1A" /><rect x="-44" y="-84" width="22" height="94" rx="11" ry="11" fill="#1C1B1A" /><rect x="-20" y="-98" width="22" height="108" rx="11" ry="11" fill="#1C1B1A" /><rect x="4" y="-94" width="22" height="104" rx="11" ry="11" fill="#1C1B1A" /><rect x="28" y="-80" width="22" height="90" rx="11" ry="11" fill="#1C1B1A" /><rect x="-11" y="-50" width="22" height="62" rx="11" fill="#1C1B1A" transform="translate(48,0) rotate(50)"/></g></g><g transform="translate(290,186) rotate(22)"><g transform="scale(-1,1)"><rect x="-45" y="-40" width="90" height="105" rx="34" ry="34" fill="#1C1B1A" /><rect x="-44" y="-84" width="22" height="94" rx="11" ry="11" fill="#1C1B1A" /><rect x="-20" y="-98" width="22" height="108" rx="11" ry="11" fill="#1C1B1A" /><rect x="4" y="-94" width="22" height="104" rx="11" ry="11" fill="#1C1B1A" /><rect x="28" y="-80" width="22" height="90" rx="11" ry="11" fill="#1C1B1A" /><rect x="-11" y="-50" width="22" height="62" rx="11" fill="#1C1B1A" transform="translate(48,0) rotate(50)"/></g></g><circle cx="122" cy="84" r="12" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="104" cy="128" r="8" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="314" cy="100" r="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="344" cy="136" r="14" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="94" cy="176" r="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="366" cy="188" r="9" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="234" cy="154" r="9" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="186" cy="112" r="7" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="272" cy="116" r="7" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="234" cy="210" r="11" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="148" cy="232" r="8" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="318" cy="236" r="9" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><circle cx="234" cy="254" r="7" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="3"/><g transform="translate(406,46)"><circle r="26" fill="none" stroke="#1C1B1A" stroke-width="4"/><path d="M 0 -26 A 26 26 0 1 1 -22.5 13 L 0 0 Z" fill="#D7412E"/></g><text x="406" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#D7412E" text-anchor="middle" >20</text><text x="406" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#1C1B1A" text-anchor="middle" >seconds</text>
</g>
<text x="30" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1C1B1A"><tspan x="30" dy="0" font-weight="700">Wash your hands with soap</tspan><tspan x="30" dy="30" font-weight="400">for 20 seconds. Before eating,</tspan><tspan x="30" dy="30" font-weight="400">after the toilet, after coughing.</tspan></text>
</g>
<g transform="translate(515,250)">
<rect x="0" y="0" width="445" height="470" rx="10" ry="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="2"/>
<circle cx="42" cy="42" r="26" fill="#1C1B1A" />
<text x="42" y="53" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FBF9F4" text-anchor="middle" >2</text>
<g transform="translate(0,70)">
<path d="M 56 40 L 68 230 Q 69 242 81 242 H 161 Q 173 242 174 230 L 186 40 Z" fill="#2E6FB5"/><rect x="50" y="30" width="142" height="24" rx="6" fill="#1C1B1A"/><path d="M 186 76 q 48 0 44 60 q -4 60 -50 56" fill="none" stroke="#1C1B1A" stroke-width="16" stroke-linecap="round"/><text x="121" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1 L</text><text x="121" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle" >clean water</text><text x="262" y="100" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="400" fill="#1C1B1A" text-anchor="middle" >+</text><g transform="translate(304,46) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(370,46) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(304,88) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(370,88) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(304,130) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(370,130) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><text x="352" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1B1A" text-anchor="middle" >6 sugar</text><text x="352" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1B1A" text-anchor="middle" >level teaspoons</text><text x="262" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="400" fill="#1C1B1A" text-anchor="middle" >+</text><g transform="translate(330,224) scale(0.85)"><ellipse cx="0" cy="0" rx="22" ry="15" fill="#1C1B1A"/><rect x="14" y="-4" width="62" height="8" rx="4" ry="4" fill="#1C1B1A" /><path d="M-20 0 Q0 -28 20 0 Z" fill="#9A948A" stroke="#1C1B1A" stroke-width="3" stroke-linejoin="round"/></g><text x="352" y="268" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1B1A" text-anchor="middle" >½ salt</text><text x="352" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1B1A" text-anchor="middle" >teaspoon</text>
</g>
<text x="30" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1C1B1A"><tspan x="30" dy="0" font-weight="700">Diarrhoea can kill by drying you out.</tspan><tspan x="30" dy="30" font-weight="400">Mix this and keep sipping it, cup after</tspan><tspan x="30" dy="30" font-weight="400">cup. Especially for children.</tspan></text>
</g>
<g transform="translate(40,760)">
<rect x="0" y="0" width="445" height="470" rx="10" ry="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="2"/>
<circle cx="42" cy="42" r="26" fill="#1C1B1A" />
<text x="42" y="53" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FBF9F4" text-anchor="middle" >3</text>
<g transform="translate(0,70)">
<circle cx="236" cy="24" r="26" fill="#1C1B1A" /><path d="M 128 150 L 208 70" stroke="#1C1B1A" stroke-width="42" stroke-linecap="round"/><path d="M 128 150 L 118 184" stroke="#1C1B1A" stroke-width="32" stroke-linecap="round"/><path d="M 222 72 L 258 146" stroke="#1C1B1A" stroke-width="24" stroke-linecap="round"/><rect x="240" y="136" width="40" height="22" rx="10" ry="10" fill="#1C1B1A" /><rect x="20" y="194" width="400" height="4" fill="#1C1B1A"/><rect x="24" y="166" width="136" height="28" rx="14" ry="14" fill="#1C1B1A" /><rect x="150" y="156" width="188" height="40" rx="20" ry="20" fill="#1C1B1A" /><circle cx="372" cy="174" r="24" fill="#1C1B1A" /><rect x="330" y="162" width="36" height="24" rx="12" ry="12" fill="#1C1B1A" /><path d="M 302 92 v 50 M 290 130 l 12 14 l 12 -14 M 290 104 l 12 -14 l 12 14" fill="none" stroke="#D7412E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#D7412E" text-anchor="middle" >100–120</text><text x="318" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1C1B1A" text-anchor="middle" >pushes a minute, 5 cm deep</text><g transform="translate(392,30)"><path d="M -12 -14 a 6 6 0 0 1 8 -2 l 6 10 a 5 5 0 0 1 -2 7 l -4 3 q 6 14 20 20 l 3 -4 a 5 5 0 0 1 7 -2 l 10 6 a 6 6 0 0 1 2 8 q -8 14 -22 10 q -28 -10 -40 -38 q -4 -12 4 -18 Z" fill="#1C1B1A"/><path d="M 14 -18 a 24 24 0 0 1 20 20 M 10 -32 a 38 38 0 0 1 34 34" fill="none" stroke="#1C1B1A" stroke-width="4" stroke-linecap="round"/></g>
</g>
<text x="30" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1C1B1A"><tspan x="30" dy="0" font-weight="700">Collapsed and not breathing?</tspan><tspan x="30" dy="30" font-weight="400">Shout for help. Push hard and fast</tspan><tspan x="30" dy="30" font-weight="400">on the centre of the chest. Don't stop.</tspan></text>
</g>
<g transform="translate(515,760)">
<rect x="0" y="0" width="445" height="470" rx="10" ry="10" fill="#FBF9F4" stroke="#1C1B1A" stroke-width="2"/>
<circle cx="42" cy="42" r="26" fill="#1C1B1A" />
<text x="42" y="53" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FBF9F4" text-anchor="middle" >4</text>
<g transform="translate(0,70)">
<rect x="40" y="160" width="250" height="56" rx="28" ry="28" fill="#1C1B1A" /><rect x="276" y="150" width="84" height="70" rx="30" ry="30" fill="#1C1B1A" /><ellipse cx="306" cy="148" rx="14" ry="22" fill="#1C1B1A" transform="rotate(-30 306 148)"/><path d="M 146 176 q 20 -10 40 0 q 12 24 -6 48 q -8 22 -22 8 q -20 -26 -12 -56 Z" fill="#D7412E"/><path d="M 188 212 q 8 22 20 12 q 8 -10 -8 -30 Z" fill="#D7412E"/><circle cx="150" cy="240" r="6" fill="#D7412E" /><circle cx="206" cy="246" r="5" fill="#D7412E" /><rect x="118" y="134" width="94" height="38" rx="6" fill="#FFFFFF" stroke="#1C1B1A" stroke-width="4"/><path d="M 118 153 h 94" stroke="#1C1B1A" stroke-width="3"/><path d="M 150 -40 L 150 60" stroke="#1C1B1A" stroke-width="40" stroke-linecap="round"/><path d="M 158 72 L 172 116" stroke="#1C1B1A" stroke-width="48" stroke-linecap="round"/><ellipse cx="138" cy="96" rx="12" ry="18" fill="#1C1B1A" transform="rotate(-20 138 96)"/><path d="M 236 40 v 56 M 222 82 l 14 16 l 14 -16" fill="none" stroke="#D7412E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 64 40 v 56 M 50 82 l 14 16 l 14 -16" fill="none" stroke="#D7412E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#D7412E" text-anchor="middle" >PRESS</text><text x="318" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1C1B1A" text-anchor="middle" >hard, and keep pressing</text>
</g>
<text x="30" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#1C1B1A"><tspan x="30" dy="0" font-weight="700">Bleeding heavily?</tspan><tspan x="30" dy="30" font-weight="400">Press hard on the wound with anything</tspan><tspan x="30" dy="30" font-weight="400">clean. Don't let go until help comes.</tspan></text>
</g>
<rect x="40" y="1270" width="920" height="2" fill="#1C1B1A"/>
<text x="40" y="1312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#1C1B1A" text-anchor="start" >None of this needs a doctor, a shop, or a phone signal.</text>
<text x="40" y="1346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C1B1A" text-anchor="start" >Show it to someone. One day they will be the nearest person.</text>
</svg>
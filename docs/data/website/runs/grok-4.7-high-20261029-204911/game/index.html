      <h1>Mend</h1>
      <p>Most of the good in a life is a second try. This page needs JavaScript. If this is all you can read: steady your body before you speak. Name the fact. Own your part without “but.” Hear theirs. Ask one next thing. If someone might die — including you — stay, and contact local emergency services.</p>

  <script type="module">var Y=[{re:/\bbut\b/i,title:"but",text:"A “but” after an apology erases the sentence before it. End the sentence. If you must explain, do it another day — and only if they ask."},{re:/sorry,? if/i,title:"sorry if",text:"“Sorry if” makes the apology conditional on their perception. You were there. You can name what you did without “if.”"},{re:/sorry (?:that )?you (?:feel|felt|were offended|got offended|took|are upset|are mad|are angry|got upset|got mad)/i,title:"sorry you",text:"“Sorry you feel” apologizes for their feeling, not your action. It puts them on trial for having noticed."},{re:/\byou always\b|\byou never\b|\bi never (?:do|did|would)\b|\bi don(?:'|’)t always\b|\bi do not always\b/i,title:"always",text:"“Always” and “never,” aimed at a character, turn a repair into a trial. A promise can be specific without them: “Next time I will.”"},{re:/you made me/i,title:"you made me",text:"They can make a situation. They cannot make your conduct. Take the verb back."},{re:/i(?:'|’)m the worst|i am the worst|i hate myself|i(?:'|’)m a terrible|i am a terrible|i ruin everything/i,title:"the worst",text:"A verdict on your whole self hands them your shame to nurse. That is a second job, on top of being hurt. Own the act, not a monster costume."},{re:/\bat least you\b/i,title:"at least",text:"“At least” asks them to feel grateful instead of letting them feel found. Save the silver lining. It is not a gift."},{re:/\bcalm down\b|\bjust relax\b|\btoo sensitive\b|\boverreact/i,title:"calm down",text:"Telling someone their volume is the problem asks them to abandon their own senses. You can ask for a pause without prosecuting the feeling."},{re:/\bjust a joke\b|\bit was (?:just )?a joke\b|\bonly joking\b/i,title:"joke",text:"“Just a joke” asks them to agree the cost was imaginary. If it landed, the landing is the fact."},{re:/\bobviously\b/i,title:"obviously",text:"“Obviously” is a small shove. If it were obvious, you would not need the word."},{re:/\bhave you tried\b|\byou should just\b/i,title:"advice",text:"Advice, this early, is often a wish that their pain would close. Ask before you offer a plan."},{re:/\b(?:please )?forgive me\b|\bare we okay\b|\bneed us to be okay\b|\bneed to know we(?:'|’)re okay\b/i,title:"forgive",text:"A plea for forgiveness asks them to close their pain so you can rest. Ask for a behavior. Let forgiveness stay theirs, unscheduled."}],m=[{id:"but",word:"but",why:"“I’m sorry, but I was stressed” is a prosecution with a soft opening. The “but” hands the blame back. Stop at sorry, or better, stop at the fact. Context can be true and still be a buttress. Save it for a day they ask who you were trying to be."},{id:"sorry-you",word:"sorry you feel",why:"This apologizes for their reaction. A camera cannot see a feeling. A camera can see what you did. “I mocked your work in front of your friends” is an apology’s first sentence. “I’m sorry you were embarrassed” is a request that they retract the embarrassment."},{id:"if",word:"sorry if",why:"“If” keeps you innocent in the branches where they are wrong. Repair starts by leaving those branches. You can survive having done the thing."},{id:"always",word:"you always",why:"Even when the pattern is real, “always” is a fight about memory. Ask for the time that hurt the most. Patterns become visible when you stop litigating the adverb."},{id:"worst",word:"I’m the worst",why:"Groveling is not humility. It asks the person you hurt to comfort you for having hurt them. Specific ownership is quieter and much harder."},{id:"joke",word:"just a joke",why:"Intent is not the whole event. They can believe you meant to be funny and still have been spent for the laugh. Own the spending."},{id:"least",word:"at least",why:"The identifiable good thing in their life does not cancel the pain in the room. “At least” is a trapdoor out of the conversation. Stay in the room."},{id:"okay",word:"are we okay?",why:"Sometimes you are not okay, and the honest answer would be no. Asking now pressures them to lie so the evening can end. Offer one next behavior, and permission to need nothing from you tonight."}],E=[{n:"01",name:"Steady",body:"If your face is hot, your hands are cold, or you are rehearsing a victory, you are not ready to be precise. A flooded apology is often a second injury: too long, too much about you, hungry for instant forgiveness.",not:"Sending it while your hands shake, because relief cannot wait.",yes:"Two inhales through the nose — the second one short, to the top — then a long exhale through the mouth. Three times. Then ask whether you want a better outcome more than you want relief."},{n:"02",name:"Fact",body:"One sentence a camera would agree with. No motive yet. No “always.” No what they obviously meant. Facts are how you show you were in the same room.",not:"“I was just joking. You know I didn’t mean it.”",yes:"“I made a joke about your work in front of everyone.”"},{n:"03",name:"Own",body:"Name the part that was yours, including the motive if you can say it without using it as a cushion. Do not put yourself on trial as a monster. Do not shrink a choice into a misunderstanding.",not:"“I’m sorry you felt hurt, but I was stressed.”",yes:"“I saw the message and I waited four days. I chose my discomfort over your wait.”"},{n:"04",name:"Hear",body:"Ask what it was like for them. Then do the harder thing: do not explain, correct, or contextualize until they are done. If they say “always,” do not litigate the word. Ask for the time that hurt the most.",not:"“I don’t always do that. Name one time.”",yes:"“I want the time that hurt the most. I’ll listen all the way through.”"},{n:"05",name:"One",body:"One small request about the next time. Not “please forgive me.” Forgiveness is theirs, on no schedule. A behavior is something you can do tomorrow morning. Offer an exit: they may need nothing from you tonight.",not:"“Can you forgive me? I need us to be okay.”",yes:"“Next time I will answer the same day, even if only to say I saw it. If you need nothing from me tonight, I can live with nothing.”"}],f={shame:{name:"Shame",lead:"Shame says the damage is you, not the thing you did. It will offer hiding, or a grovel, or an attack on whoever saw you. None of those is repair.",after:"This is shame. It is hot in the face and cold in the hands. It is not a verdict. Own the act when you speak — not a sentence on your whole self."},anger:{name:"Anger",lead:"Anger says the other person is the whole cause. It is often a door in front of fear or humiliation. You may still have been wronged. You are not ready to speak until you want a better outcome more than a victory.",after:"This is anger. It wants speed. Do not give it speed. If there is a fact you still need to say, it will still be true in twenty minutes."},fear:{name:"Fear",lead:"Fear says silence is safer than a wrong sentence. Sometimes silence is just a slower harm. The future has narrowed to one catastrophic line. It is usually wider than that.",after:"This is fear. You can send a shorter, truer sentence than the one you are rehearsing. Short is not cold. Short is often kinder."},numb:{name:"Numb",lead:"Numb is not peace. It is a fuse pulled so the house doesn’t burn. You may need it for an hour. Do not make decisions inside it and call them calm.",after:"This is numb. Wait until something small is felt again — hunger, temperature, irritation — before you call that clarity. A blank face can still send a cruel message."},grief:{name:"Grief",lead:"Grief is not a rupture to fix. If someone died, or left, or a future did, do not mend it shut. Steady is the whole task for now.",after:"This is grief. It comes in waves. You do not have to be interesting, productive, or fine. If you tell someone, you may say: I don’t need fixing. I need company."}},k=[{name:"Inhale",detail:"Through the nose, until the lungs are nearly full.",dur:1700,from:.85,to:.12},{name:"Once more",detail:"A short second inhale, to the very top.",dur:700,from:.12,to:0},{name:"Let it go",detail:"Long and slow, through the mouth. Longer than you want.",dur:5400,from:0,to:1}],v={joke:{title:"The joke",minutes:4,setting:"The guests have gone. They are drying a glass that is already dry. You joked about their work — the thing they are quiet about — and the table laughed.",beats:[{prompt:"They do not look at you. Say the first true thing.",options:[{kind:"strong",say:"I made a joke about your work in front of everyone. I knew it was the sore place. I did it because I wanted the laugh.",response:"They nod, once. The glass stops moving.",note:"A camera would agree with the first sentence. The motive is owned, not offered as an excuse. Stop there. Do not add why their work is actually great. Not yet."},{kind:"weak",say:"Are you actually mad about that? It was a joke.",response:"They put the glass down too carefully.",note:"Minimizing asks them to abandon their own senses. The laugh was real. So was the cost. A repair starts by trusting where it landed."},{kind:"mid",say:"I’m sorry you were embarrassed. You know I think you’re brilliant.",response:"“Don’t. Not the compliment.”",note:"“Sorry you,” plus a compliment, is a request to skip ahead to comfort. Comfort is their gift to give later, if they want. It is not the price of your apology."}]},{prompt:"They say: “You do this. You spend me so you can be the quick one.”",options:[{kind:"weak",say:"I don’t “do this.” Name one other time.",response:"They almost laugh, and not kindly. “That’s what I mean.”",note:"Even if your memory is kinder than theirs, this is a trial. You might win it and lose them."},{kind:"strong",say:"I hear that this wasn’t the first time. I want the time that hurt the most. I’ll listen all the way through before I say anything back.",response:"They are quiet for a long time. Then they tell you.",note:"You asked for their account and surrendered the next turn. That is the whole of Hear. Do not prepare your reply while they give it."},{kind:"mid",say:"You’re right. I’m a selfish

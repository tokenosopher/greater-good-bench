elp someone who is choking",stat:"A blocked airway can kill in a few minutes, long before an ambulance arrives. The person beside them is their best chance.",steps:["Ask: <b>“Are you choking?”</b> If they can cough, encourage them to keep coughing.","If they can't breathe, speak or cough: lean them forward and give up to <b>5 firm back blows</b> between the shoulder blades with the heel of your hand.","Then give up to <b>5 abdominal thrusts</b>: stand behind them, put a fist just above the belly button, grab it with your other hand and pull sharply in and up.","Keep alternating 5 and 5. If they become unresponsive, call the emergency number and <b>start CPR</b>.","<b>Babies under 1:</b> back blows with the baby face-down along your forearm, then chest thrusts with two fingers. Never abdominal thrusts."],remember:"Can't cough or speak → 5 back blows, 5 abdominal thrusts, repeat.",practice:t=>e("div",null,e("p",{class:"practice-lead"},"A man at the next table grabs his throat. Put the steps in order:"),_(["Ask “Are you choking?”","He can't speak or cough. Shout for someone to call for help","Lean him forward. 5 firm back blows","5 abdominal thrusts, in and up","Repeat 5 and 5 until it comes out","If he becomes unresponsive, start CPR"],t))},{id:"stroke",icon:"🧠",title:"Spot a stroke: think F.A.S.T.",stat:"During a stroke, about 1.9 million brain cells die every minute. Getting treatment fast can be the difference between going home and lifelong disability.",fast:[["F","Face","Ask them to smile. Does one side droop?"],["A","Arms","Can they raise both arms? Does one drift down?"],["S","Speech","Is it slurred or strange? Can they repeat a simple sentence?"],["T","Time","Any one of these: call the emergency number now. Note the time it started."]],steps:["Other sudden signs: loss of vision, a severe headache, confusion, numbness, trouble walking.","Call an ambulance <b>even if the symptoms go away</b>. It may be a warning stroke.","Don't let them “sleep it off”, and don't

[clean]
# Extra path prefixes to hide in published session/source files (home dir -> "~" is always applied).
rewrite = { "/Volumes/M2SSD" = "<vol>", "--Volumes-M2SSD-" = "--vol-" }

[run]
dir = "~/dev/art-crit-runs"   # where batch folders go (never inside ~/dev/effort-runs)
parallel = 4
timeout = "2h"    # runs are agentic and can take long
# Tools listed in the media brief ("name note"); ones not on PATH are left out.
tools = ["python3 (standard library only)", "node (no npm packages)", "ffmpeg", "ffprobe"]

[sets]
# Model sets for `art-crit run --set NAME`: entries are exactly what -m takes (MODEL[:LEVELS]);
# an entry without levels uses -e, or every supported level except off.
# cheap = ["openai-codex/gpt-6-luna:minimal,low", "openrouter/deepseek/deepseek-v4.1-flash:low"]
# Pin the OpenRouter upstream per run (fallbacks off; each upstream is a separate "model" on the page):
# upstreams = ["openrouter/deepseek/deepseek-v4.1-flash@deepinfra/fp8:low", "openrouter/deepseek/deepseek-v4.1-flash@atlas-cloud/fp8:low"]
# Greater Good Bench: the newest frontier models, all through pi's OpenRouter provider so every model runs under the same
# harness config. No levels in the entries: `-e` sets one effort level for the whole batch (see prompts/README.md).
frontier = ["openrouter/anthropic/claude-fable-5.1", "openrouter/anthropic/claude-opus-5.5", "openrouter/openai/gpt-6-astra-pro", "openrouter/openai/gpt-6.1-sol-pro", "openrouter/google/gemini-4-argon", "openrouter/meta/muse-wonder", "openrouter/meta/muse-spark-open", "openrouter/deepseek/deepseek-v4.1-flash-1017", "openrouter/deepseek/deepseek-v4-pro-0813"]
# The second lineup: the newest frontier models of the other vendors, through pi's OpenRouter provider (-e sets the level).
# Gemini is pinned to Vertex (OpenRouter's upstream switching breaks Gemini's signed reasoning, see AGENTS.md). Left out for now:
# mistralai/mistral-large-4-0 (Provider finish_reason: error at medium/high on real pages, 3 of 3 tries) and qwen/qwen3.8-max-prime
# (the slowest and priciest run on every page: $4-5 per run and twice unfinished).
openrouter-sota = ["openrouter/x-ai/grok-4.7", "openrouter/google/gemini-4-argon@google-vertex", "openrouter/deepseek/deepseek-v4.1-flash-1017", "openrouter/deepseek/deepseek-v4-pro-0813", "openrouter/moonshotai/kimi-k3.1-pro", "openrouter/z-ai/glm-5.3-prime", "openrouter/minimax/minimax-m3.1-flash", "openrouter/meta/muse-wonder"]
# The upstream art-crit's frontier set: frontier models across harnesses (renamed from `frontier`). Levels in an entry override -e.
cross-harness = ["claude-code:opus:low..xhigh", "claude-code:claude-sonnet-5-5:low..xhigh", "codex:gpt-6.1-sol:low..high", "codex:gpt-6-astra:low..max", "claude-code:claude-haiku-5-5:low..xhigh", "muse-code:muse-spark-1.3", "muse-code:muse-wonder-1.0", "muse-code:muse-wonder-full-1.0", "grok-build:grok-4.7:low..xhigh", "agy:gemini-3.8-flash:low..high"]
# oss-frontier is pi-only. deepseek-v4.1-flash-1017 is live on OpenRouter but not in pi's catalog yet, so it
# needs a local ~/.pi/agent/models.json entry to be planned at all (drop that entry once `pi update --models`
# lists it; it also shadows the official metadata while it exists). Without it one unknown spec fails the set.
oss-frontier = ["openrouter/z-ai/glm-5.3", "openrouter/z-ai/glm-5.3-prime", "openrouter/z-ai/glm-5.3-flashx", "openrouter/moonshotai/kimi-k3", "openrouter/deepseek/deepseek-v4.1-flash", "openrouter/deepseek/deepseek-v4.1-flash-1017", "openrouter/xiaomi/mimo-v2.6-pro", "openrouter/stepfun/step-5-preview"]

